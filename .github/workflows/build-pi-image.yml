name: Build USBHub Raspberry Pi image

on:
  push:
    tags:
      - 'pi-image-v*'

permissions:
  contents: write

jobs:
  build-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Check out USBHub
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Install pi-gen build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y coreutils quilt parted qemu-user-binfmt debootstrap zerofree zip \
            dosfstools e2fsprogs libarchive-tools libcap2-bin grep rsync xz-utils file git curl bc \
            gpg pigz xxd arch-test bmap-tools kmod

      - name: Prepare pinned pi-gen build
        env:
          PI_GEN_REV: d346cd53562b3c6b4f94c9155175f814258c456d
        run: |
          git clone https://github.com/RPi-Distro/pi-gen.git .pi-gen
          git -C .pi-gen checkout "$PI_GEN_REV"
          cp -a pi/image/stage2/05-usbhub-usbip .pi-gen/stage2/
          chmod +x .pi-gen/stage2/05-usbhub-usbip/01-run.sh
          touch .pi-gen/stage3/SKIP .pi-gen/stage4/SKIP .pi-gen/stage5/SKIP
          touch .pi-gen/stage3/SKIP_IMAGES .pi-gen/stage4/SKIP_IMAGES .pi-gen/stage5/SKIP_IMAGES
          cat > .pi-gen/config <<'EOF'
          IMG_NAME='USBHub-rpios-lite-arm64'
          PI_GEN_RELEASE='USBHub community image'
          RELEASE='trixie'
          ARCH='arm64'
          ARCHIVE_FILENAME='USBHub-rpios-lite-arm64'
          DEPLOY_COMPRESSION='xz'
          COMPRESSION_LEVEL='3'
          ENABLE_SSH=1
          ENABLE_CLOUD_INIT=1
          TARGET_HOSTNAME='usbhub'
          EOF

      - name: Confirm native ARM64 build runner
        run: |
          test "$(dpkg --print-architecture)" = arm64
          arch-test -n arm64

      - name: Build Raspberry Pi OS image
        run: sudo ./.pi-gen/build.sh

      - name: Check and checksum image
        id: image
        run: |
          set -euo pipefail
          deploy=.pi-gen/deploy
          sudo chown -R "$(id -u):$(id -g)" "$deploy"
          mkdir -p "$deploy"
          archive="$(find "$deploy" -maxdepth 1 -type f -name '*.zip' -print -quit)"
          if [ -n "$archive" ]; then
            mapfile -t images < <(python3 - "$archive" "$deploy" <<'PY'
          import pathlib
          import sys
          import zipfile

          archive = pathlib.Path(sys.argv[1])
          output = pathlib.Path(sys.argv[2])
          with zipfile.ZipFile(archive) as zf:
              names = [n for n in zf.namelist() if n.lower().endswith('.img')]
              if len(names) != 1:
                  raise SystemExit(f"Expected one disk image in {archive}, found {len(names)}")
              target = output / pathlib.Path(names[0]).name
              with zf.open(names[0]) as src, target.open('wb') as dst:
                  while chunk := src.read(8 * 1024 * 1024):
                      dst.write(chunk)
          print(target)
          PY
            )
            test "${#images[@]}" -eq 1
            rm "$archive"
          else
            mapfile -t images < <(find "$deploy" -maxdepth 1 -type f -name '*.img' -print)
            test "${#images[@]}" -eq 1
          fi
          xz -T0 -3 "${images[0]}"
          image="${images[0]}.xz"
          xz -t "$image"
          (cd "$(dirname "$image")" && sha256sum "$(basename "$image")" > "$(basename "$image").sha256")
          echo "image=$image" >> "$GITHUB_OUTPUT"
          ls -lh "$image" "${image}.sha256"

      - name: Publish flash image release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.image.outputs.image }}" \
            "${{ steps.image.outputs.image }}.sha256" \
            --title "USBHub Raspberry Pi image $GITHUB_REF_NAME" \
            --notes "Raspberry Pi OS Lite 64-bit image with the USBHub USB/IP server, storage guard, and automatic unique mDNS hostname for default names. Use Raspberry Pi Imager to flash the .img.xz file and set the first-boot account, temporary password, Wi-Fi, and SSH options. The first Cockpit login requires changing the temporary password; later password changes are available from Cockpit Accounts. USB camera enumeration is supported, but live isochronous webcam streaming is not verified on the development Wi-Fi link. See pi/image/README.md and pi/usbip/README.md in the source repository for details and limitations."
